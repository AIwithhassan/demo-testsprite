version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16.2.4 (App Router)
  - React 19.2.4
  - Tailwind CSS
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Home page with list of features
  - path: /about
    file: src/app/about/page.tsx
    auth_required: false
    description: Static about page listing demo features
  - path: /contact
    file: src/app/contact/page.tsx
    auth_required: false
    description: Contact form with name, email, message fields
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: Login page with email and password fields
  - path: /dashboard
    file: src/app/dashboard/page.tsx
    auth_required: true
    description: Protected dashboard for logged-in users
  - path: /api/hello
    file: src/app/api/hello/route.ts
    auth_required: false
    description: GET API returning hello message
  - path: /api/contact
    file: src/app/api/contact/route.ts
    auth_required: false
    description: POST API for contact form submission
  - path: /_not-found
    file: src/app/not-found.tsx
    auth_required: false
    description: Custom 404 page
features:
  - name: User Login
    description: Login with email and password credentials
    files:
      - src/app/login/page.tsx
    entry_route: /login
    user_interactions:
      - Fill email input field with test@example.com
      - Fill password input field with password123
      - Click Login button to submit
      - On success, redirect to /dashboard
      - On failure, see error message "Use test@example.com / password123"
    api_calls: []
    auth_required: false
  - name: Protected Dashboard
    description: Dashboard page only accessible to authenticated users
    files:
      - src/app/dashboard/page.tsx
    entry_route: /dashboard
    user_interactions:
      - Access dashboard with auth-token cookie set
      - See welcome message "Welcome! You are logged in."
      - Click Logout button to clear cookie and redirect to /login
      - Access without auth redirects to /login
    api_calls: []
    auth_required: true
  - name: Contact Form
    description: Form to submit contact inquiries with validation
    files:
      - src/app/contact/page.tsx
      - src/app/api/contact/route.ts
    entry_route: /contact
    user_interactions:
      - Fill name input field
      - Fill email input field
      - Fill message textarea
      - Click Send button to submit
      - See "Message sent!" on success (green)
      - See "Fill all fields correctly." on error (red)
    api_calls:
      - method: POST
        endpoint: /api/contact
        body: { "name": string, "email": string, "message": string }
        success_response: { "success": true, "message": "Message received" }
        error_response: { "error": "Missing required fields" }
    auth_required: false
  - name: Navigation
    description: Consistent navigation bar across all pages
    files:
      - src/app/layout.tsx
    entry_route: /
    user_interactions:
      - See navigation bar with links to Home, About, Contact, Login, Dashboard
      - Click each link to navigate to corresponding page
    api_calls: []
    auth_required: false
  - name: API Hello Endpoint
    description: Simple GET API returning hello message
    files:
      - src/app/api/hello/route.ts
    entry_route: /api/hello
    user_interactions: []
    api_calls:
      - method: GET
        endpoint: /api/hello
        response: { "message": "Hello from TestSprite API!" }
    auth_required: false
  - name: 404 Page
    description: Custom 404 page for invalid routes
    files:
      - src/app/not-found.tsx
    entry_route: /nonexistent
    user_interactions:
      - Navigate to invalid route
      - See "404 - Page Not Found" heading
      - See "The page you are looking for does not exist." message
      - Click "Go Home" link to return to /
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Authentication uses client-side cookie check only, not server-side validation
    location: src/app/dashboard/page.tsx
    impact: Auth state is managed entirely in browser, no server-side protection
  - issue: Login credentials are hardcoded, no real authentication backend
    location: src/app/login/page.tsx
    impact: Only test@example.com/password123 works, no user management
